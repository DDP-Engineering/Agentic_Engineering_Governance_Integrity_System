[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-release-tools"
version = "1.0.0"
description = "Offline reproducible AEGIS release archive tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis-build-archive = "aegis_release.cli:build_main"
aegis-inspect-archive = "aegis_release.cli:inspect_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP009"]
