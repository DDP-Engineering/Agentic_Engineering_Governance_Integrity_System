schema = 1
stage = "requirement"
sequence = 3
instruction = "Express one current behavior per Requirement with confirmation separate from behavior. Keep its title, behavior, and confirmation self-contained and free of ticket, Run, or Requirement identifiers; provenance belongs in the owning Run. Link real impacted files and tests or a concrete manual method. Use a Specification only when the Requirement is not buildable alone."
sections = ["inputs_from_alignment", "requirement_artifact_changes", "traceability", "risk_based_test_depth_decision", "gaps_and_uncertainties", "outputs_and_handoff"]
common_findings = ["A Requirement mixes multiple behaviors or embeds its confirmation method.", "Traceability names hoped-for files or tests rather than verified paths."]
recovery_actions = [
  { condition = "Behavior or confirmation is not yet buildable.", operation = "stage.set_section", guidance = "Record the smallest clarification, gap, or manual confirmation needed to continue." },
  { condition = "No Requirement change is needed and no Stage work was applied.", operation = "stage.skip", guidance = "Skip with the proportional reason and preserve the existing Requirement truth." },
]
