[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
dynamic = ["version"]
description = "Repository-local AEGIS governance protocol runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis = "aegis.composition:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "aegis.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
