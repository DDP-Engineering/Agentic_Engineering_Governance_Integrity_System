# Complete AEGIS workflow configuration. Repository policy is explicit: the
# shipped template is unrestricted/disabled until an operator opts into rules.
schema_version = 3

# Optional AEGIS quick-run advisory. Omission is equivalent to disabled mode
# with max_paths = 10 and preserves compatibility with schema-3 deployment
# tooling that recognizes only the original tables. Uncomment to opt in:
# [quick.changed_paths]
# mode = "advise"
# max_paths = 10

[source]
roots = ["src", "app", "lib"]

[tests]
roots = ["tests", "test"]

[requirements]
roots = [".agentic/requirements"]

[documentation]
roots = [".agentic/knowledge/components"]
component_template = ".agentic/knowledge/components/component_template.md"

[components]
manifest = ".agentic/components.toml"

[components.baseline_guard]
mode = "disabled"

[knowledge]
roots = [".agentic/knowledge"]

[reports]
adoption_root = ".agentic/reports/adoption"

[traceability]
language = "python"
source_extensions = [".py"]
test_file_patterns = ["test_*.py", "*_test.py"]

[traceability.coverage]
mode = "disabled"
coverable_roots = []
exclude = []

[adoption]
allow_component_bundles = true
max_bundle_components = 5

[adoption.source_changes]
mode = "unrestricted"

[alignment]
# Reserved compatibility metadata. Current releases validate and preserve these
# values but do not use them to change stage routing or closure decisions.
enabled = true
pause_on_open_questions = true
risk_threshold = "medium"
allow_recommended_responses = true

[alignment.protected_scope]
# Reserved compatibility metadata; this is not an active path guardrail.
mode = "disabled"
patterns = []

[interface]
# `latest` keeps each stage's final form on disk after import. That is what makes
# a stage restartable in a fresh agent session: the next session reads the
# previous stage's focused form instead of parsing the larger internal run
# graph and audit trail.
# `versioned` also keeps every superseded revision; `discard` deletes the form
# after import and is the leanest repo, at the cost of that handoff.
stage_form_retention = "latest"
check_execution = "external"

[gates.build]
mode = "disabled"
commands = []
# Optional per-command timeout in seconds; omitted means 1800. Example:
# timeout = 2400

[gates.typecheck]
mode = "disabled"
commands = []

[gates.lint]
mode = "disabled"
commands = []

[gates.test]
mode = "disabled"
commands = []
# Optional argv-only prefix for `aegis verify impact --run`. AEGIS appends
# each resolved linked-test selector as one separate argument and never invokes
# this prefix through a shell. Leave empty to use the complete test gate.
# impacted_command = ["python", "-m", "pytest", "-q"]

[gates.security]
mode = "disabled"
commands = []

[guardrails.secrets]
mode = "disabled"
patterns = []

[guardrails.protected_paths]
mode = "disabled"
patterns = []
operations = []

[guardrails.working_tree]
mode = "unrestricted"
blocked_patterns = []

[guardrails.write_access]
mode = "unrestricted"

[guardrails.scope]
mode = "unrestricted"
allowed_roots = []

[guardrails.delivery]
mode = "disabled"
command_patterns = []
