[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "3.0.0"
description = "Agentic Engineering Governance & Integrity System"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
aegis = "aegis.cli:main"

# Single source of truth: the package ships from the template tree so the dev
# project tests the exact code copied into generated projects.
[tool.setuptools.packages.find]
where = ["template/.agentic/cli/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["template/.agentic/cli/src", "../waegis/src"]

[tool.ruff.lint.isort]
# This project sorts "import x" and "from x import y" together in one
# alphabetical order by module name, rather than ruff/isort's default of two
# separate groups. Run `ruff check --select I` to check import order against
# this convention.
force-sort-within-sections = true
