[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waegis"
dynamic = ["version"]
description = "Offline operator lifecycle tool for the AEGIS payload"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
waegis = "waegis.composition:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "waegis.version.WIZARD_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP009"]
