[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waegis"
dynamic = ["version"]
description = "Guided configuration and deployment wizard for AEGIS"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
waegis = "waegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "waegis.version.WIZARD_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: real-subprocess tests (real git / wrapper scripts, still offline); deselect with -m 'not integration'",
]
