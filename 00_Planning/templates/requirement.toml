# One independently understandable behavior stored under the Requirements path
# selected in .agentic/config.toml as REQ-<32hex>.toml.
# This file contains only the current authoritative Requirement. Update it in
# place, or delete it when the behavior no longer belongs to the project.

schema = 1
artifact_type = "requirement"
id = "REQ-00000000000000000000000000000000"
title = "<one behavior in a short title>"
status = "draft" # draft | active
priority = "Must" # Must | Should | Could

behavior = """
<State exactly one self-contained behavior. Do not depend on ticket, Run, or
other Requirement references to make it understandable.>
"""

confirmation = """
<State separately how the behavior is confirmed.>
"""

verification_kind = "automated" # automated | manual

# Required for manual verification; empty for automated verification.
manual_method = ""

# Repository-relative implementation paths with forward slashes.
impacted_files = ["<implementation path>"]

# Optional build-level detail. The filename inherits this Requirement's 32hex.
specification = "" # Example: .agentic/requirements/SPEC-<32hex>.md

rationale = "<why this behavior exists>"
updated_at = 2026-01-01T00:00:00Z

# Repeat for every real project test linked to this Requirement. For manual
# verification, remove all [[tests]] entries and complete manual_method.
[[tests]]
path = "<configured test root>/<test file>"
selector = "<framework selector, or empty>"
purposes = ["happy_path"] # happy_path | boundary | edge | negative | failure_path
covered_files = ["<implementation path>"]
