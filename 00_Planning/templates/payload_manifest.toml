# Product-owned manifest installed at .agentic/aegis/manifest.toml.
# Release packaging replaces every placeholder and lists every payload-owned
# file. Project-owned siblings of .agentic/aegis/ are never part of this list.

schema = 1
artifact_type = "payload_manifest"
payload_id = "PAYLOAD-00000000000000000000000000000000"
product = "AEGIS"
product_version = "<product version>"
platform = "<windows | linux>"
architecture = "x86_64"
created_at = 2026-01-01T00:00:00Z

supported_schemas = [
  "payload_manifest:1",
  "project_config:1",
  "requirement:1",
  "specification:1",
  "component:1",
  "adoption:1",
  "run:1",
  "stage:1",
  "abandonment:1",
]

[[files]]
path = "cli/<payload file>"
size = 0
sha256 = "<64 lowercase hexadecimal characters>"

