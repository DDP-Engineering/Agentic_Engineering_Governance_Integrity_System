# WAEGIS generates this project-owned integration map during installation.
# These values are immediately usable; the developer does not fill in a setup
# form before starting work.

schema = 1
artifact_type = "project_config"

[paths]
requirements = ".agentic/requirements"
components = ".agentic/components"

# If WAEGIS confidently detects existing repository test roots, it replaces
# this default with those roots. Multiple roots are allowed.
tests = [".agentic/tests"]

adoptions = ".agentic/adoptions"
runs = ".agentic/runs"

# WAEGIS replaces this command when it confidently detects an existing project
# test command or framework. The shipped fallback uses Python's standard
# library and the default .agentic/tests root.
[validation.tests.project]
command = ["python", "-m", "unittest", "discover", "-s", ".agentic/tests"]
working_directory = "."

# WAEGIS adds detected lint commands. Project-specific audits can be added in
# the same form. Their outcomes are advisory findings, never default blockers.
#
# [validation.lints.project]
# command = ["python", "-m", "ruff", "check", "."]
# working_directory = "."
#
# [validation.audits.codestyle]
# command = ["python", "02_Tools/audits/audit_codestyle.py", "--changed-only"]
# working_directory = "."
#
# [validation.audits.logging_coverage]
# command = ["python", "02_Tools/audits/audit_logging_coverage.py", "--changed-only"]
# working_directory = "."

[policy]
risk_attention_threshold = "medium"
protected_scope_patterns = []
