schema = 1

id = "REQ-UX-461978be"

title = "Render compact text by default and JSON on request"

status = "active"

requirement = """
CodeGraph shall render each response as compact text by default, showing
symbol IDs as their shortest unique prefix of at least 10 hexadecimal
characters, and as exactly one JSON document on standard output when `--json`
is requested, with progress written only to standard error.
"""

verification = "Representative responses match the golden text examples in the protocol spec, including a 10-character ID; `--json` output parses as one document with full 32-character IDs; queries write nothing to standard error on success; index progress appears only on standard error."

affected_paths = [
