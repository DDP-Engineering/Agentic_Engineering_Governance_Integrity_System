schema = 1

id = "REQ-REL-1162622e"

title = "Bound parsing time per file"

status = "active"

requirement = """
If parsing or extracting one file exceeds `[codegraph] parse_timeout_seconds`,
then CodeGraph shall record the file as `failed` with reason `parse-timeout`,
publish none of its facts, and continue indexing the remaining files.
"""

verification = "With a short timeout and a test hook that slows one file's parse, that file is `failed` with `parse-timeout`, its earlier facts are absent, the other files are indexed, and the next file after it parses correctly."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/python_extract.py",
    "05_Software/aegis/plugins/codegraph/codegraph/indexer.py",
]

