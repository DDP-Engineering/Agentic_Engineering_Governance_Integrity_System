schema = 1

id = "REQ-REL-53d13fb2"

title = "Stop a plugin that exceeds its time limit"

status = "active"

requirement = """
If the CodeGraph plugin is still running when its operation's configured time
limit expires, the AEGIS CLI shall terminate the plugin's whole process tree,
report a process failure and exit 1, leaving the database files unchanged and
the process that launched AEGIS running.
"""

verification = "A stub plugin that starts a child process and outlives `timeout_seconds`, and separately `check_timeout_seconds` and a positive `index_timeout_seconds`, makes the command exit 1 within the limit plus a small margin; both stub processes are gone, the test process that launched AEGIS is alive, and the database folder is byte-identical. Boundary: with `index_timeout_seconds = 0`, an index stub that runs longer than the read limit completes successfully."

affected_paths = [
