schema = 1

id = "REQ-REL-4277bfc7"

title = "Recover an interrupted write only during explicit indexing"

status = "active"

requirement = """
When an indexing run starts on a CodeGraph database with a hot journal,
CodeGraph shall let SQLite roll the journal back under the writer lock before
updating the index, without deleting any journal file itself.
"""

verification = "After an interrupted transaction, readers report `needs_recovery` and leave the journal in place; the next `index` completes and readers then report `ready` with the updated generation."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/safety.py",
    "05_Software/aegis/plugins/codegraph/codegraph/store.py",
]

linked_tests = [
