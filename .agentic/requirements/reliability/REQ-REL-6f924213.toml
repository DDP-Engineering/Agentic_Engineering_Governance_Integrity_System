schema = 1

id = "REQ-REL-6f924213"

title = "Allow one index writer at a time"

status = "active"

requirement = """
CodeGraph shall allow at most one indexing run at a time through an
operating-system lock on the stable `codegraph.lock` file that is released
when its holder exits, reporting index state `busy` to a concurrent run.
"""

verification = "While a slowed indexing run holds the lock, a second run reports `busy` immediately; killing the first run, including while its spawned workers run, lets a new run proceed; the lock file keeps its identity across runs and rebuilds and is never deleted by indexing."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/safety.py",
    "05_Software/aegis/plugins/codegraph/codegraph/cli.py",
]

