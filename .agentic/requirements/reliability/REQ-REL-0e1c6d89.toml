id = "REQ-REL-0e1c6d89"

title = "Bound the plugin output while it is read"

status = "active"

requirement = """
If the CodeGraph plugin writes more than the output cap to standard output,
the AEGIS CLI shall stop reading at the cap, terminate the plugin, and exit 1
with a one-line error naming the output limit.
"""

verification = "A stub writing 10 MiB to standard output makes a read command exit 1 promptly with the output-limit error and leaves no stub process; a stub writing a valid response just under the cap succeeds."

