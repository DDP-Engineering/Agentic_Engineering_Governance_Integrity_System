schema = 1

id = "REQ-REL-bd1529a5"

title = "Rebuild without replacing the wrong file"

status = "active"

requirement = """
When an operator requests a rebuild, or indexing finds an unsupported
CodeGraph schema, CodeGraph shall build and validate a new database under a
temporary name in the database folder, replace the target only after
validation, replace an unrecoverable old database together with its journal,
and keep the previous database when the rebuild fails.
"""

verification = "Rebuild over a healthy database, an interrupted one and a damaged one whose header still carries the CodeGraph ID: each ends with a valid database and no journal from the old file; a forced failure during the build leaves the old database readable; an open reader on Windows causes bounded retries, not corruption."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/safety.py",
    "05_Software/aegis/plugins/codegraph/codegraph/store.py",
]

