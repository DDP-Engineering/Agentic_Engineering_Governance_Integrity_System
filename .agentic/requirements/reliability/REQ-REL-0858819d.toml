schema = 1

id = "REQ-REL-0858819d"

title = "Stop indexing when its launcher disappears"

status = "active"

requirement = """
While indexing with `--watch-stdin`, if standard input reaches end-of-file,
CodeGraph shall cancel parsing, extraction, resolution and publication, stop
its extraction workers, and exit leaving the last completed generation
unchanged.
"""

verification = "Start `codegraph.py index --watch-stdin` on a pipe and close the pipe during a slowed run: the process exits promptly, publishes no new generation and leaves no worker process. Boundary: without the flag, a closed standard input does not stop the run."

affected_paths = [
