schema = 1

id = "REQ-REL-1eeb1914"

title = "Publish each index generation atomically"

status = "active"

requirement = """
CodeGraph shall publish each indexing run as one complete generation with a
new random 128-bit snapshot ID, leaving the last completed generation readable
and unchanged when a run is interrupted, cancelled or fails.
"""

verification = "Kill the indexer at injected points before publication: readers then see the previous generation and snapshot ID, and SQLite's integrity check passes. Two completed runs, and a delete-and-rebuild, produce distinct snapshot IDs."

