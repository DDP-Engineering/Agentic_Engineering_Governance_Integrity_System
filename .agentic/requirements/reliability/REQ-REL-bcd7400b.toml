schema = 1
id = "REQ-REL-bcd7400b"
title = "Report a command stopped by its time limit as unproven"
status = "active"
requirement = """
If a configured command is stopped because it reached its time limit, then
AEGIS Light shall report that outcome as unproven and distinct from a command
that ran to completion and failed.
"""
verification = "Stop a command by setting a limit shorter than it needs, and confirm the report names it as reaching its limit with nothing proven, under a different finding name than a command that exited non-zero on its own."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_run_report.py::test_a_stopped_command_is_reported_as_unproven",
]
spec = ""
priority = "normal"
rationale = """
A stopped command produced no verdict at all; recording it as a failure invents evidence, and recording it as a pass hides that nothing was checked.
"""
created = 2026-08-14
updated = 2026-08-14
