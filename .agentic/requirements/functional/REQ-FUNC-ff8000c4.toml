schema = 1

id = "REQ-FUNC-ff8000c4"

title = "Page through results with request-bound tokens"

status = "active"

requirement = """
When a query has more results than one response holds, CodeGraph shall return
a page token bound to the snapshot ID and to the operation, target, ordering
and limit, and for a supplied token it shall return status `expired` when the
snapshot changed and status `error` when the token belongs to a different
request.
"""

verification = "Paging through a high fan-out result returns every record exactly once; a token reused after re-indexing or a rebuild returns `expired`; a token reused with another target returns `error`."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/queries.py",
    "05_Software/aegis/plugins/codegraph/codegraph/protocol.py",
]

