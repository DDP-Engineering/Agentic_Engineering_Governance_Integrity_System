schema = 1

id = "REQ-FUNC-7432a8a2"

title = "Label Python references by their resolution evidence"

status = "active"

requirement = """
When CodeGraph indexes a Python file, it shall record each call, import and
identifier reference with its location, target spelling and one resolution
label from `direct-syntax`, `lexical-binding`, `candidate`, `unresolved` and
`external`, linking a target only for `direct-syntax` and `lexical-binding`
and keeping name-only matches as bounded candidates.
"""

verification = "Fixtures with local shadowing, module and `from` imports, star imports, dynamic calls through `getattr` and `importlib`, and same-named functions in two modules produce the labels in the extraction spec; a call whose name matches exactly one function elsewhere stays `candidate`; no test-coverage relation is produced."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/python_extract.py",
]

