title = "Map the plugin response status to the exit code"

status = "active"

requirement = """
When the CodeGraph plugin returns a valid response, the AEGIS CLI shall exit 0
for status `ok`, `ambiguous`, `not_found`, `expired`, `unavailable` or
`disabled`, and exit 1 for status `error`.
"""

verification = "A stub returning each status value through a read command produces the listed exit code, and the printed response keeps the stub's status."

