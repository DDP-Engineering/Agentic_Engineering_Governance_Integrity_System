# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-6b4ff1ad"

title = "Render the requirement register as a component coverage diagram"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When an operator asks for a diagram of the requirement register, the CLI shall emit a Mermaid flowchart — to standard output, or to a named file written as UTF-8 — that places every requirement under the component whose knowledge page claims it, marks each one with the coverage class matching the outcome the governance check reaches for that same record, so that a linked test which does not resolve, a behavior still in draft and a withdrawn behavior are each distinguishable from one nothing verifies, and places requirements no knowledge page claims in a separate unclaimed group.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Run the command over a repository holding one requirement of every coverage class - a resolving linked test, a linked test whose file was deleted, a declared by-hand method, nothing at all, a draft and a retired behavior - and whose knowledge pages claim only some of them: the emitted flowchart groups each requirement under its claiming component, assigns each the class matching what `check` reports for that record, and groups the unclaimed ones apart."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/aegis/template/.agentic/aegis.py",
    "05_Software/aegis/template/.agentic/CLI.md",
    "05_Software/aegis/template/.agentic/AGENTS.md",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/aegis/tests/test_run_report.py::test_diagram_groups_requirements_by_component_and_coverage",
    "05_Software/aegis/tests/test_run_report.py::test_diagram_writes_utf8_independent_of_the_console_encoding",
    "05_Software/aegis/tests/test_run_report.py::test_every_coverage_class_matches_what_check_reports",
    "05_Software/aegis/tests/test_run_report.py::test_a_declared_method_does_not_excuse_a_link_that_no_longer_resolves",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = """
The register already answers where verification is thin, but only one
requirement at a time. A reviewer reads a grouped, colored picture faster
than a list. Every mark comes from the one classifier `check` also judges by,
because a picture that reached its own verdict would be a second opinion
competing with the findings rather than a rendering of them.
"""

created = 2026-08-21
updated = 2026-08-22
