id = "REQ-FUNC-6343dfb8"

title = "Keep diagrams outside every stage obligation"

status = "active"

requirement = """
The workflow payload shall treat proposed-implementation diagrams as optional illustration for the human operator, so that no stage completion list, validation step, review verdict or check finding depends on whether a diagram file exists or what it contains.
"""

verification = "Run the linked structural and check tests: no Done when list in the step files mentions a diagram; the build, validate and deliver steps do not direct the agent to read or reconcile a diagram file; and check reports the same findings for a repository with and without `.agentic/tasks/diagram_TASK-<id>.md`."

affected_paths = [
    "05_Software/aegis/template/.agentic/steps/3_design.md",
