title = "Derive Python module names from import roots"

status = "active"

requirement = """
CodeGraph shall derive Python module names from the import roots in
`[codegraph] python_import_roots` when that setting is non-empty, otherwise
from recognized manifests and `src` layouts, otherwise from the repository
root, without executing repository code.
"""

verification = "Fixtures for an explicit setting, a `pyproject.toml` package directory, a `src/` layout and a flat repository give the expected qualified module names; a fixture whose `setup.py` would write a marker file leaves no marker."

affected_paths = [
