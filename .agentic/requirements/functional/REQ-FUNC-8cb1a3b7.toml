schema = 1

id = "REQ-FUNC-8cb1a3b7"

title = "Report status, index, freshness and capability separately"

status = "active"

requirement = """
CodeGraph shall return every operation's result in the versioned response
envelope with separate `status`, `index`, `freshness` and `indexing_supported`
fields, the snapshot ID and the generation, so that an empty successful search
reports status `ok` with no results and an unusable index reports status
`unavailable`.
"""

verification = "Fixture responses for every operation and field value validate against the envelope rules in the protocol spec; `find` with no match returns `ok` and an empty result list; the same `find` on a missing database returns `unavailable` with index `missing`."

