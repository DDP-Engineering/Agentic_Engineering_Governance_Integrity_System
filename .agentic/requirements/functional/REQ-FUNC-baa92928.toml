title = "Select source files with the AEGIS layout rules"

status = "active"

requirement = """
CodeGraph shall select for indexing the inventoried files that match `[layout]
source`, `[layout] tests` when `[codegraph] index_tests` is true, or
`[codegraph] include`, excluding files that match `[codegraph] exclude`,
built-in dependency and output folders, or the installed root `.agentic/`
folder, using the same directory-prefix and case-sensitive glob semantics as
the AEGIS CLI.
"""

