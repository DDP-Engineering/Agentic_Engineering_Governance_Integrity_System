id = "REQ-FUNC-48ff6d8e"

title = "Run explicit indexing with parent liveness"

status = "active"

requirement = """
When an operator runs `know_graph_index`, with or without `--rebuild`, while
CodeGraph is enabled, the AEGIS CLI shall run the plugin's index operation
under the configured indexing time limit with a standard-input pipe that stays
open until AEGIS exits, pass the plugin's progress through to standard error,
and, when the plugin runs, exit 0 only when it reports status `ok`.
"""

verification = "A stub index operation records its arguments, writes progress lines to standard error and waits for end-of-file on standard input: AEGIS passes `--watch-stdin`, and `--rebuild` when given; the progress appears on AEGIS's standard error; stub success and failure give exit 0 and 1. Boundary: killing the AEGIS process makes the stub observe end-of-file."

