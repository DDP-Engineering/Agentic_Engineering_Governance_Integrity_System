title = "Find symbols by name"

status = "active"

requirement = """
When an operator runs the CodeGraph `find` operation with a name, CodeGraph
shall return the matching symbols ranked by exact qualified name, exact simple
name, name prefix or identifier word, then path, with deterministic
tie-breaking, each with its ID, kind, signature, role and source range.
"""

verification = "A fixture with duplicate names, CamelCase and snake_case words, and source and test roles returns the order given in the protocol spec, identically on repeated runs; a name with several equally ranked matches returns all of them rather than one."

