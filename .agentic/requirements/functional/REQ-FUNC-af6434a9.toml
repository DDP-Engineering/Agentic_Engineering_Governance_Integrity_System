title = "Answer queries without writing"

status = "active"

requirement = """
When an operator runs the CodeGraph `status`, `check`, `find`, `file`,
`symbol`, `callers` or `refs` operation, CodeGraph shall leave every file and
folder unchanged, including when the database is missing, stale, incompatible,
busy or needs recovery.
"""

verification = "Record every path, size and hash, including `.agentic/` and a plugin copy without `__pycache__`, before and after each operation in each database state, through AEGIS and standalone and with a read-only database folder: the records are identical and a missing database is not created."

