id = "REQ-FUNC-3a18929b"

title = "Inventory files from Git or the filesystem"

status = "active"

requirement = """
CodeGraph shall take its candidate files from Git's tracked files and, when
`[codegraph] include_untracked` is true, its non-ignored untracked files while
the root is a Git repository, and from a walk of the configured folders
labeled `inventory=filesystem` while Git is not installed or the root is not a
Git repository.
"""

verification = "Fixtures: a Git repository with tracked, untracked, ignored and deleted files (ignored and deleted omitted, untracked following the setting); a plain folder with Git available (filesystem walk reported, dependency folders pruned); Git removed from `PATH` (filesystem walk). Boundary: a Git repository whose listing command fails returns status `error` and does not fall back to the filesystem."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/scope.py",
]

linked_tests = [
    "05_Software/aegis/plugins/codegraph/tests/test_scope.py::test_git_inventory_lists_tracked_and_untracked_visible_files",
