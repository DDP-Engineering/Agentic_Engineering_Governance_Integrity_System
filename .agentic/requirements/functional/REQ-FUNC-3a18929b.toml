    "05_Software/aegis/plugins/codegraph/tests/test_scope.py::test_missing_git_falls_back_to_the_filesystem",
    "05_Software/aegis/plugins/codegraph/tests/test_scope.py::test_failing_git_listing_is_an_error_not_a_wider_scan",
]


