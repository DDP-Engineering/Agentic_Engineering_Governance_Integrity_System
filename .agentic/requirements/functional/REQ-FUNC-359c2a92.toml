title = "List the callers of a symbol"

status = "active"

requirement = """
When an operator runs the CodeGraph `callers` operation with a symbol ID,
CodeGraph shall return the linked incoming calls and, listed separately, the
candidate callers of that symbol, each with its location and resolution label.
"""

