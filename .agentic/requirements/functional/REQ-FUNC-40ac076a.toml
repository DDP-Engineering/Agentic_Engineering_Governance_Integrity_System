schema = 1

id = "REQ-FUNC-40ac076a"

title = "Answer several symbol IDs in one knowledge-graph query"

status = "active"

requirement = """
When the CodeGraph `symbol`, `callers` or `refs` operation is given up to 20
symbol IDs or ID prefixes, CodeGraph shall answer for all of them in one
response, in the order given, with every reference naming the target symbol it
answers for, and shall instead answer the first target that is malformed,
unknown or ambiguous for the whole request, naming that target.
"""

verification = "With two fixture functions: `callers` for both IDs returns each one's callers in request order, each record's `subject` equal to its target's full ID and each text line ending `for=<prefix>`; `refs` and `symbol` (with `details.symbols`) behave the same; a duplicate ID is answered once; paging across both targets returns every record once and a token reused with the targets in another order returns `page_token_mismatch`; 21 IDs return `error` with `invalid_request`; a valid ID followed by an unknown one returns `not_found` naming the unknown ID, and an ambiguous prefix returns `ambiguous` with its choices."

