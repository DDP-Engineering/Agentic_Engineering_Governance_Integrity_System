schema = 1

id = "REQ-FUNC-45ed74a5"

title = "Keep only safe facts from files with syntax errors"

status = "active"

requirement = """
If a Python file contains syntax errors, then CodeGraph shall record the file
as `partial` with the facts from unaffected regions, or as `failed` with a
concise reason when no region can be extracted safely, and remove that file's
facts from earlier generations.
"""

verification = "An in-progress edit with an unclosed bracket inside one function keeps the definitions outside it and marks the file `partial`; an undecodable `.py` file is `failed`; facts indexed earlier for those files are no longer returned."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/python_extract.py",
    "05_Software/aegis/plugins/codegraph/codegraph/indexer.py",
]

