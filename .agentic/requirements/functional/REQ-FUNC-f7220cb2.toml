schema = 1

id = "REQ-FUNC-f7220cb2"

title = "Keep diagram generation disabled unless explicitly enabled"

status = "active"

requirement = """
Unless the AEGIS configuration sets `[diagrams] enabled` to the boolean `true`, the workflow shall keep diagram generation disabled, so that a missing `[diagrams]` table, a missing key, `false`, and every other value draw no diagram at any stage.
"""

verification = "Run the linked initialization and structural tests: a newly initialized configuration contains `[diagrams]` with `enabled = false`; the payload enables the diagram guide only for the boolean `true`; check reports nothing about a configuration that has no `[diagrams]` table; and no stage, template or adoption step other than the design pointer directs drawing a diagram."

