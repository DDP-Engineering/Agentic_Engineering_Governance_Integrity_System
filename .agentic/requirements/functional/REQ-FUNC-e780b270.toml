schema = 1

id = "REQ-FUNC-e780b270"

title = "Validate the plugin protocol before printing a response"

status = "active"

requirement = """
If the CodeGraph plugin writes nothing to standard output, the AEGIS CLI shall
report that the plugin failed without an answer, naming the last line of its
standard error, and exit 1. If the plugin's standard output is not a single JSON
object with `schema` 1, `provider` `codegraph` and the protocol version that AEGIS
requested, the AEGIS CLI shall report a protocol failure and exit 1 instead of
printing the plugin's output.
"""

verification = "Stubs returning non-JSON text, two JSON documents, `schema` 2, another provider name, another protocol version, a wrong `action`, an unknown `status` or a missing text view each make the command exit 1 with a protocol-failure line and none of the stub output on standard output; a stub returning nothing exits 1 with a failed-without-an-answer line naming its standard error; a stub returning a valid envelope is printed."

affected_paths = [
    "05_Software/aegis/template/.agentic/aegis.py",
]

linked_tests = [
    "05_Software/aegis/tests/test_codegraph_dispatch.py::test_malformed_plugin_output_is_a_protocol_failure",
    "05_Software/aegis/tests/test_codegraph_dispatch.py::test_an_empty_answer_reports_what_the_plugin_said",
]


