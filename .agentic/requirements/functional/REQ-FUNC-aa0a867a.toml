schema = 1

id = "REQ-FUNC-aa0a867a"

title = "Extract Python definitions with exact source ranges"

status = "active"

requirement = """
When CodeGraph indexes a Python file, it shall record each module, class,
function, method, parameter and supported assignment binding with its kind,
simple and qualified name, compact signature, enclosing scope and exact start
and end positions.
"""

verification = "Fixtures with nested classes, decorated and async functions, multiline signatures, non-ASCII identifiers and CRLF line endings yield the definitions and positions given in the extraction spec; definitions written inside comments or strings yield none."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/python_extract.py",
]

