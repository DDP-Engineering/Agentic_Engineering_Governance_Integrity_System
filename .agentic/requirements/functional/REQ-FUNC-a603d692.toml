title = "Outline one indexed file"

status = "active"

requirement = """
When an operator runs the CodeGraph `file` operation with a repository path,
CodeGraph shall return that file's symbols in source order with their nesting,
kinds, signatures and ranges, together with the file's role, language and
extraction status, and status `not_found` for a path that is not indexed.
"""

verification = "For a fixture module, the outline lists classes, methods and functions in source order with nesting; a path given with backslashes or `./` resolves to the same file; an unindexed or excluded path returns `not_found`."

