id = "REQ-FUNC-ff30861f"

title = "Check cited files before reporting locations"

status = "active"

requirement = """
When a query result cites source locations, CodeGraph shall hash-check the
cited files, mark citations from files changed since indexing as stale instead
of reporting their old locations as current, and report freshness
`not_fully_checked`.
"""

verification = "After indexing, edit one cited file: a query citing it marks that citation stale while citations from unchanged files remain current, and every query reports `not_fully_checked`."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/queries.py",
]

