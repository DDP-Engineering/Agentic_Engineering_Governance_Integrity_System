schema = 1
id = "REQ-FUNC-dcb42072"
title = "Fold close-out into delivery when publication cannot fail"
status = "active"
requirement = """
Where the agreed delivery outcome is a repository-local commit with no push,
pull request, release, or deployment, the delivery step shall record the closed
task state within that same commit rather than in a separate close-out commit.
"""
verification = "Inspection: read the delivery step file and confirm it directs one commit when the outcome is local only, and a separate close-out commit whenever the outcome can still fail after the delivery commit is made."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/steps/6_deliver.md",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_structure.py::test_deliver_folds_close_out_into_a_local_only_delivery",
]
spec = ""
priority = "normal"
rationale = """
The second commit exists so that success is recorded only once it is observed; when the commit is itself the whole outcome there is nothing left to observe, and the ceremony buys nothing.
"""
created = 2026-08-14
updated = 2026-08-14
