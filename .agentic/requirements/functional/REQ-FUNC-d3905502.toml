# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-d3905502"

title = "Serialize the traceability record as Markdown or CSV"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
Where the operator names an output format, the CLI shall serialize the traceability record as either a Markdown table or comma-separated values, escaping every value so that text containing that format's own delimiters is carried whole rather than breaking the row, and writing the bytes in an encoding a spreadsheet application opens without corrupting characters outside plain ASCII.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Run the command in each format over a repository whose requirement prose contains a vertical bar, a comma, a double quote, a line break and a character outside ASCII: the comma-separated output parses back through a standard CSV reader to the same field values with the same row count, the Markdown output keeps one table row per requirement with its columns intact, and the bytes of each written file decode to the original characters when opened as the encoding that format declares."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/aegis/template/.agentic/aegis.py",
    "05_Software/aegis/template/.agentic/CLI.md",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/aegis/tests/test_run_report.py::test_trace_csv_round_trips_prose_holding_its_own_delimiters",
    "05_Software/aegis/tests/test_run_report.py::test_trace_markdown_keeps_its_columns_when_prose_holds_a_bar",
    "05_Software/aegis/tests/test_run_report.py::test_trace_writes_an_encoding_a_spreadsheet_opens",
    "05_Software/aegis/tests/test_run_report.py::test_trace_rejects_an_unknown_format",
    "05_Software/aegis/tests/test_run_report.py::test_trace_markdown_list_items_stay_within_their_cells",
    "05_Software/aegis/tests/test_run_report.py::test_trace_markdown_keeps_literal_prose",
    "05_Software/aegis/tests/test_run_report.py::test_trace_summary_uses_separate_paragraphs_and_singular",
    "05_Software/aegis/tests/test_run_report.py::test_trace_csv_preserves_line_breaks_inside_list_entries",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-7ec58ca7.md"

priority = "normal"   # low | normal | high
rationale = """
The two formats answer to two different readers, and each fails in its own
way. A Markdown table is what a reviewer reads in the repository, and one
vertical bar inside a requirement statement silently splits a row into the
wrong columns. Comma-separated values are what a spreadsheet opens, and a
statement containing a comma, a quote or a line break corrupts the file the
same way. The register already holds characters outside plain ASCII, so an
encoding a spreadsheet guesses wrongly turns a delivered artifact into
mojibake. None of that is visible in the record's content, which is why it is
verified apart from it.
"""

created = 2026-09-02
updated = 2026-09-02
