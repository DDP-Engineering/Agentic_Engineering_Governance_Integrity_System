schema = 1

id = "REQ-FUNC-41815b22"

title = "Check index freshness against the sources"

status = "active"

requirement = """
When an operator runs the CodeGraph `check` operation, CodeGraph shall compare
the selected scope's current inventory, content hashes, project manifests and
indexing configuration with the recorded manifest and report freshness
`current`, `stale` with bounded lists of added, changed, deleted and failed
files, or `unknown` when the comparison is interrupted or sources change
during it.
"""

verification = "After indexing a fixture, `check` reports `current`; after adding, equal-size editing or deleting a file, changing a manifest or an ingestion setting, it reports `stale` with that difference; changing `max_results` keeps `current`; a test hook editing a file during the check gives `unknown`; nothing is written."

