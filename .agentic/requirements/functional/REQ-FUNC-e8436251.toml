schema = 1

id = "REQ-FUNC-e8436251"

title = "Resolve symbol ID prefixes without guessing"

status = "active"

requirement = """
When an operator supplies a symbol ID or ID prefix, CodeGraph shall resolve it
against the whole current index, returning status `ambiguous` with the
matching choices when several symbols share the prefix and status `not_found`
when none does.
"""

verification = "In a seeded index where two IDs share an 11-character prefix, the 10-character prefix returns `ambiguous` with both, a 12-character prefix resolves, an unknown prefix returns `not_found`, and a symbol beyond the first page of any listing resolves."

