schema = 1

id = "REQ-FUNC-7e74dacf"

title = "Update the index incrementally"

status = "active"

requirement = """
When an operator runs indexing against an existing compatible index, CodeGraph
shall reuse facts for files whose content hash and extractor revisions are
unchanged, re-extract changed files, add new files, and remove the facts of
deleted or newly excluded files.
"""

verification = "Index a fixture, then add, edit with equal size, delete, rename and exclude files and change a manifest: after re-indexing, queries reflect every change, an instrumented counter shows unchanged files were not re-parsed, and no fact refers to a removed file."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/indexer.py",
    "05_Software/aegis/plugins/codegraph/codegraph/store.py",
]

