title = "Confine the configured database path before dispatch"

status = "active"

requirement = """
If `[codegraph] database` does not resolve, after following symlinks and
junctions, to a file named `NAME.sqlite` directly inside the repository's
`.agentic/knowledge/codegraph/` folder, where `NAME` contains only letters,
digits, `_` and `-`, then the AEGIS CLI shall exit 1 with a one-line error
naming the setting and start no plugin process.
"""

verification = "In isolated payload copies with a recording stub, configure `src/index.sqlite`, `../outside.sqlite`, `.agentic/knowledge/codegraph/codegraph.sqlite-journal`, `.agentic/knowledge/codegraph/codegraph.lock`, `.agentic/knowledge/codegraph/sub/x.sqlite`, and (where the platform allows symlinks) a `.agentic/knowledge/codegraph` link to an outside folder: each `know_graph` call exits 1 with the error and no launch. Boundary: `.agentic/knowledge/codegraph/codegraph.sqlite` and `.agentic/knowledge/codegraph/alt-1.sqlite` launch the stub."

