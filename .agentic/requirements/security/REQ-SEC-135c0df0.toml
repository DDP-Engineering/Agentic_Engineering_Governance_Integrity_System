schema = 1

id = "REQ-SEC-135c0df0"

title = "Open only CodeGraph databases for writing"

status = "active"

requirement = """
If a file already exists at the configured database path without the CodeGraph
`application_id` in its SQLite header, then CodeGraph shall refuse to index,
recover or rebuild it and leave the file byte-identical.
"""

verification = "A foreign SQLite database with and without a hot journal, and a text file, at the database path stay byte-identical after `index` and `index --rebuild`, which report the refusal; a missing database is created with the CodeGraph `application_id`."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/safety.py",
    "05_Software/aegis/plugins/codegraph/codegraph/store.py",
]

