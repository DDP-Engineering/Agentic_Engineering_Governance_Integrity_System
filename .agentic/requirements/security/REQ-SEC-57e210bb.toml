schema = 1

id = "REQ-SEC-57e210bb"

title = "Refuse to index into storage that Git would record"

status = "active"

requirement = """
If the root is a Git repository and Git reports the database folder as not
ignored or as containing tracked files, then CodeGraph shall refuse to index
with status `error` and reason `destination_not_ignored` or
`destination_tracked`, naming the remedy, before creating or modifying any
file or folder.
"""

verification = "In a Git fixture without the ignore rule, indexing returns `destination_not_ignored` and neither the database folder nor the lock file exists afterwards; with the rule and a tracked file inside the folder it returns `destination_tracked`; with the rule and nothing tracked it proceeds; in a non-Git folder the check is skipped."

affected_paths = [
    "05_Software/aegis/plugins/codegraph/codegraph/safety.py",
]

linked_tests = [
