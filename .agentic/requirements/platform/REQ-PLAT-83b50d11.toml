schema = 1
id = "REQ-PLAT-83b50d11"
title = "Run configured commands in a configured working directory"
status = "active"
requirement = """
Where `[commands] workdir` names a repository-relative directory, AEGIS Light
shall run every configured command from that directory rather than from the
repository root.
"""
verification = "Set `workdir` to a subdirectory, run a configured command that reports its own working directory, and confirm the reported directory is the configured one and that `workdir` is never itself executed as a command."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_run_report.py::test_configured_workdir_runs_the_command_there",
    "05_Software/aegis-light/tests/test_run_report.py::test_workdir_is_not_executed_as_a_command",
]
spec = ""
priority = "normal"
rationale = """
A repository whose application lives below the root previously had to embed a directory change in the command string, which broke every path the tool substituted into that command.
"""
created = 2026-08-14
updated = 2026-08-14
