schema = 1

id = "REQ-PLAT-dc7bdd06"

title = "Use the vendored parsers that match the running Python"

status = "active"

requirement = """
CodeGraph shall load native parser modules only for indexing, from the
vendored set matching the running platform, architecture and Python ABI, and
shall report `indexing_supported` false when no set matches and
`python_support` `untested` when a compatible set serves a Python outside the
tested support matrix.
"""

verification = "Read operations leave no native module in `sys.modules`; a simulated unmatched platform reports `indexing_supported` false while queries still work; a simulated newer Python served by an abi3 set reports `untested`; a separately installed `tree_sitter` on `PYTHONPATH` or in user site-packages is not loaded under the AEGIS dispatch flags."

affected_paths = [
