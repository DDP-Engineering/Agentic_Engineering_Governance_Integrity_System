id = "REQ-TEST-5d8f424b"
title = "Reduce an oversized impacted set to its test files"
status = "active"
requirement = """
If the impacted test references would make a command longer than the running
platform can launch, then AEGIS Light shall reduce those references to their
distinct test files.
"""
verification = "Build an impacted set whose substituted command exceeds the platform limit and confirm the command instead names each distinct test file once, without test-name suffixes, and stays within the limit."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_run_report.py::test_impacted_collapses_to_test_files_when_the_command_is_too_long",
]
spec = ""
priority = "normal"
rationale = """
Running every test in a handful of files is a far smaller loss than abandoning focused selection altogether, and it keeps the command launchable.
"""
