schema = 1
id = "REQ-TEST-2bfb7a86"
title = "Rebase impacted test references to the command working directory"
status = "active"
requirement = """
When the impacted test set is substituted into a command that runs in a
working directory below the repository root, AEGIS Light shall express each
test reference relative to that working directory.
"""
verification = "With a working directory configured and requirements linking repository-relative tests, confirm the substituted command carries references relative to that directory, and that a reference lying outside it produces the full-suite fallback instead."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_run_report.py::test_impacted_rebases_references_to_the_workdir",
    "05_Software/aegis-light/tests/test_run_report.py::test_impacted_falls_back_when_a_reference_is_outside_the_workdir",
]
spec = ""
priority = "normal"
rationale = """
Stored references are repository-relative so they stay comparable across configurations; only the moment of substitution knows where the command will run.
"""
created = 2026-08-14
updated = 2026-08-14
