schema = 1
id = "REQ-TEST-db8d4d31"
title = "Select the impacted diff basis"
status = "active"
requirement = """
When a revision is named as the impacted diff basis, AEGIS Light shall
determine the changed files against that revision instead of against the merge
base with the default branch.
"""
verification = "On a branch holding several commits, run impacted selection with and without the basis naming the current commit, and confirm the already-committed changes are excluded in the first run and included in the second."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_run_report.py::test_impacted_base_option_narrows_the_diff_basis",
]
spec = ""
priority = "normal"
rationale = """
The merge base is right for reviewing a whole branch and wrong for the edit-run loop, where only the uncommitted change matters.
"""
created = 2026-08-14
updated = 2026-08-14
