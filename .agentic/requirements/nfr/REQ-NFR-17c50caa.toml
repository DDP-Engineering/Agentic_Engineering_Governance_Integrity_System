schema = 1

id = "REQ-NFR-17c50caa"

title = "Bound query output"

status = "active"

requirement = """
CodeGraph shall limit each query response to `[codegraph] max_results` records and
`max_output_bytes` bytes including metadata, truncating at record boundaries and
reporting `has_more`; when a single record alone exceeds the budget, it shall keep
that record with its locations and IDs exact and its long signature, name and
spelling text shortened with an ellipsis; and it shall cap an explicitly enlarged
response at 32 KiB.
"""

verification = "On a high fan-out fixture, default responses hold at most 20 records and 8192 bytes and remain valid JSON with `has_more` true; `--max-bytes 100000` yields at most 32768 bytes; text output obeys the same limits; a budget smaller than one record still returns one record per page until paging ends; a record with a 70,000-character signature is shortened to fit 32768 bytes with its path and ID intact."

