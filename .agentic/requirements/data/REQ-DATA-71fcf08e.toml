schema = 1
id = "REQ-DATA-71fcf08e"
title = "Record the commit a task started from"
status = "active"
requirement = """
When a task journal is created in a repository with commit history, AEGIS
Light shall record in its header the commit that was checked out at that
moment.
"""
verification = "Create a task journal in a repository with history and confirm its header names the commit that was checked out; create one where no history exists and confirm the header simply omits it."
affected_paths = [
    "05_Software/aegis-light/template/.agentic/templates/task.md",
    "05_Software/aegis-light/template/.agentic/aegis.py",
]
linked_tests = [
    "05_Software/aegis-light/tests/test_cli_core.py::test_task_records_the_commit_it_started_from",
    "05_Software/aegis-light/tests/test_cli_core.py::test_task_records_no_commit_without_history",
]
spec = ""
priority = "normal"
rationale = """
Without a recorded starting point every later measurement of what the task changed has to guess, and the only available guess - the fork point of the branch - answers a different question.
"""
created = 2026-08-14
updated = 2026-08-14
