# AEGIS configuration. Written once by `aegis init` and yours from
# then on - upgrades never overwrite this file.

schema = 1

[commands]
# `aegis test` runs `test`; `aegis check --run` runs every entry here.
test = "python -m pytest -q 05_Software/aegis/tests"
test_impacted = "python -m pytest -q {tests}"
lint = "python -m ruff check 05_Software/aegis"
# timeout = 1800                        # seconds allowed per command

[layout]
# Globs used by the traceability heuristics of `aegis check`.
source = [
    "05_Software/aegis/integrations/opencode/",
    "05_Software/aegis/integrations/codex/",
    "05_Software/aegis/integrations/pi/",
    "05_Software/aegis/integrations/qwen/",
    "05_Software/aegis/integrations/claude/",
    "05_Software/aegis/integrations/shared/",
    "02_Tools/",
    "05_Software/aegis/template/.agentic/aegis/",
    "05_Software/aegis/template/.agentic/",
]
tests = [
    "05_Software/aegis/integrations/tests/",
    "05_Software/aegis/tests/",
    "05_Software/aegis/tests/",
]
docs = [
    "README.md",
    "05_Software/aegis/integrations/README.md",
    "05_Software/aegis/README.md",
    "06_SoftwareDocu/",
    "CHANGELOG.md",
]

[zones]
# What each stage may write besides `.agentic/`, which every stage may
# always write. Values name the globs above: "source", "tests". A stage
# left out entirely may write anywhere - that is why build and deliver
# are not listed. Advisory like everything else: check reports an edit
# outside the zone, it never stops one. The defaults are shown; uncomment
# and change a line to widen or narrow one stage.
# frame = []
# specify = []
# design = []
# survey = []
# components = ["tests"]
# close = []

[review]
# Optional explicit verdicts and bounded fix-and-re-review rounds. Normal
# validation remains required when explicit review is disabled.
enabled = true
max_fix_cycles = 2

[check]
secret_patterns_extra = []
ignore = []
strict_promote = []
# run = ["test", "lint"]   # restrict what `check --run` executes; without
#                          # this, side-effect-looking names are skipped
